<section class="card form-panel mx-auto">
  <div class="card-body p-4 p-lg-5"><span class="eyebrow">NUEVA CUENTA</span>
    <h1 class="h3 mt-2">Regístrate como estudiante</h1>
    <p class="text-secondary">Completa tus datos para comenzar a elegir tus materias.</p>
    <form [formGroup]="form" (ngSubmit)="save()"><app-user-fields [form]="form" />
      <div class="mt-3"><label for="register-password" class="form-label">Contraseña</label><input
          id="register-password" class="form-control" type="password" formControlName="password"
          autocomplete="new-password" maxlength="128">
        <div class="form-text">Entre 8 y 128 caracteres.</div><app-field-error [control]="form.controls.password" />
      </div>
      <div class="mt-3"><label for="register-confirm" class="form-label">Confirma la contraseña</label><input
          id="register-confirm" class="form-control" type="password" formControlName="confirmation"
          autocomplete="new-password"><app-field-error [control]="form.controls.confirmation" />
        @if (mismatch()) { <div class="small text-danger">Las contraseñas no coinciden.</div> }</div>
      <div class="d-flex justify-content-between align-items-center mt-4"><a routerLink="/login">Volver al
          ingreso</a><button class="btn btn-primary" [disabled]="ui.busy()">Crear cuenta</button></div>
    </form>
  </div>
</section>
